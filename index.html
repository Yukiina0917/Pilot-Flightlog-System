<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>China Airlines FlightLog System</title>
  <link rel="icon" type="image/x-icon" href="https://yukiina0917.sirv.com/Images/CAL-LOGO-64x64.png">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

<body class="flex flex-col h-screen overflow-hidden">
  <header class="sticky top-0 z-30 bg-white text-slate-800 border-b border-slate-200 px-6 py-3 shrink-0 shadow-sm h-[80px]">
    <div class="max-w-[96vw] mx-auto flex items-center justify-between">
      <a href="#" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
        <img src="https://yukiina0917.sirv.com/Images/3335b2eb03000002ebcc.png" alt="Logo" class="h-14 w-auto object-contain">
        <span class="text-xl font-bold tracking-wide text-slate-900">FlightLog System</span>
      </a>

      <div class="flex items-center gap-6">
  <div class="text-right border-r border-slate-200 pr-6 hidden sm:block">
    <!-- 替換成包含四道金槓與姓名的組合 -->
    <div class="flex items-center justify-end gap-2">
      <div class="flex flex-col gap-[2px] bg-slate-900 p-1 rounded shadow-sm" title="Captain 4-Stripes">
        <div class="w-4 h-[2px] bg-amber-400 rounded-full"></div>
        <div class="w-4 h-[2px] bg-amber-400 rounded-full"></div>
        <div class="w-4 h-[2px] bg-amber-400 rounded-full"></div>
        <div class="w-4 h-[2px] bg-amber-400 rounded-full"></div>
      </div>
      <p class="text-sm font-bold text-slate-800 tracking-wide">Pilot Capt. Yukiina</p>
    </div>
    <p class="text-xs font-medium text-slate-500 tracking-normal mt-0.5">Type Rating A350 XWB Series</p>
  </div>

        <div class="flex items-center gap-3 text-sm font-semibold">
          <div class="bg-slate-50 px-3 py-1 rounded-lg border border-slate-200 shadow-sm">
            <span class="text-slate-500 mr-2">A359:</span>
            <span id="hours-a359" style="color: #23569d;" class="text-base font-bold">0:00</span>
          </div>
          <div class="bg-slate-50 px-3 py-1 rounded-lg border border-slate-200 shadow-sm">
            <span class="text-slate-500 mr-2">A35K:</span>
            <span id="hours-a35k" style="color: #23569d;" class="text-base font-bold">0:00</span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-[96vw] mx-auto px-4 py-4 w-full h-[calc(100vh-80px)] flex flex-col gap-4 overflow-hidden">
    <!-- 上方區域：地圖與右側操作按鈕區 -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 shrink-0 items-center">
      <!-- 左側 3 欄放置地圖 -->
      <div class="md:col-span-3 bg-white rounded-xl border border-slate-200 p-2 shadow-sm">
        <div id="map"></div>
      </div>

      <!-- 右側 1 欄放置控制按鈕 -->
      <div class="bg-slate-50 rounded-xl border border-slate-200 p-4 shadow-sm flex flex-col gap-3 justify-center h-full">
        <button onclick="openCreateModal()" class="w-full text-white font-semibold py-2.5 px-4 rounded-lg shadow transition-all hover:opacity-90 flex items-center justify-center gap-2" style="background-color: #23569d;">
          <i data-lucide="plus-circle" class="w-5 h-5"></i>
          <span>新增飛行紀錄</span>
        </button>

        <div class="grid grid-cols-2 gap-2">
          <button onclick="exportToCSV()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-3 rounded-lg shadow text-xs flex items-center justify-center gap-1.5 transition-colors">
            <i data-lucide="file-spread-sheet" class="w-4 h-4"></i>
            <span>匯出 CSV</span>
          </button>

          <label class="w-full bg-slate-700 hover:bg-slate-800 text-white font-medium py-2 px-3 rounded-lg shadow text-xs flex items-center justify-center gap-1.5 transition-colors cursor-pointer">
            <i data-lucide="upload" class="w-4 h-4"></i>
            <span>匯入 CSV</span>
            <input type="file" id="csv-file-input" accept=".csv" class="hidden" onchange="importFromCSV(event)">
          </label>
        </div>
      </div>
    </div>

    <!-- 下方紀錄表格 -->
    <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-md flex-1 flex flex-col min-h-0">
      <div class="overflow-x-auto overflow-y-auto h-full w-full flex-1">
        <table class="w-full text-center border-collapse text-xs">
          <thead>
            <tr style="background-color: #23569d;" class="sticky top-0 z-10 text-white border-b border-blue-900 whitespace-nowrap shadow-sm">
              <th class="p-3 font-semibold text-center align-middle bg-[#23569d] relative">
                <div class="inline-flex items-center justify-center gap-1.5">
                  <span>日期</span>
                  <button type="button" onclick="openDatePicker()" class="hover:text-blue-200 transition-colors focus:outline-none cursor-pointer" title="搜尋日期">
                    <i data-lucide="search" class="w-3.5 h-3.5 inline-block"></i>
                  </button>
                  <button id="reset-date-btn" type="button" onclick="resetDateFilter()" class="hidden hover:text-red-300 transition-colors focus:outline-none cursor-pointer" title="清除搜尋">
                    <i data-lucide="x-circle" class="w-3.5 h-3.5 inline-block"></i>
                  </button>
                </div>
                <input type="date" id="date-search-input" class="absolute opacity-0 pointer-events-none w-0 h-0 bottom-0 left-1/2" onchange="filterByDate(this.value)"/>
              </th>
              <th class="p-3 font-semibold text-center align-middle bg-[#23569d]">機型</th>
              
              <!-- 出發地表頭：增加搜尋與清除按鈕 -->
              <th class="p-3 font-semibold text-center align-middle bg-[#23569d] relative">
                <div class="inline-flex items-center justify-center gap-1.5">
                  <span>出發地</span>
                  <button type="button" onclick="openDepSearchPrompt()" class="hover:text-blue-200 transition-colors focus:outline-none cursor-pointer" title="搜尋出發地">
                    <i data-lucide="search" class="w-3.5 h-3.5 inline-block"></i>
                  </button>
                  <button id="reset-dep-btn" type="button" onclick="resetDepFilter()" class="hidden hover:text-red-300 transition-colors focus:outline-none cursor-pointer" title="清除搜尋">
                    <i data-lucide="x-circle" class="w-3.5 h-3.5 inline-block"></i>
                  </button>
                </div>
              </th>

              <th class="p-3 font-semibold text-center align-middle bg-[#23569d] w-6"></th>

              <!-- 目的地表頭：增加搜尋與清除按鈕 -->
              <th class="p-3 font-semibold text-center align-middle bg-[#23569d] relative">
                <div class="inline-flex items-center justify-center gap-1.5">
                  <span>目的地</span>
                  <button type="button" onclick="openDestSearchPrompt()" class="hover:text-blue-200 transition-colors focus:outline-none cursor-pointer" title="搜尋目的地">
                    <i data-lucide="search" class="w-3.5 h-3.5 inline-block"></i>
                  </button>
                  <button id="reset-dest-btn" type="button" onclick="resetDestFilter()" class="hidden hover:text-red-300 transition-colors focus:outline-none cursor-pointer" title="清除搜尋">
                    <i data-lucide="x-circle" class="w-3.5 h-3.5 inline-block"></i>
                  </button>
                </div>
              </th>

              <th class="p-3 font-semibold text-center align-middle bg-[#23569d]">飛行時間</th>
              <th class="p-3 font-semibold text-center align-middle bg-[#23569d]">高度 (FL)</th>
              <th class="p-3 font-semibold text-center align-middle bg-[#23569d]">PAX</th>
              <th class="p-3 font-semibold text-center align-middle bg-[#23569d]">Cargo</th>
              <th class="p-3 font-semibold text-center align-middle bg-[#23569d]">起飛重量</th>
              <th class="p-3 font-semibold text-center align-middle bg-[#23569d]">TFG</th>
              <th class="p-3 font-semibold text-center align-middle bg-[#23569d]">TTG</th>
              <th class="p-3 font-semibold text-center align-middle bg-[#23569d]">ENR</th>
              <th class="p-3 font-semibold text-center align-middle bg-[#23569d]">Remaining</th>
              <th class="p-3 font-semibold text-center align-middle bg-[#23569d]">TFU</th>
              <th class="p-3 font-semibold text-center align-middle bg-[#23569d]">降落速度</th>
              <th class="p-3 font-semibold text-center align-middle bg-[#23569d]">Landing V/S</th>
              <th class="p-3 font-semibold text-center align-middle bg-[#23569d]">操作</th>
            </tr>
          </thead>
          <tbody id="flight-table-body" class="divide-y divide-slate-200 text-slate-700"></tbody>
        </table>
      </div>
      
      <div id="empty-state" class="py-12 text-center text-slate-400 flex flex-col items-center justify-center gap-2">
        <i data-lucide="plane-takeoff" class="w-10 h-10 opacity-50"></i>
        <p class="text-sm" id="empty-msg">尚無飛行紀錄，點擊按鈕新增紀錄</p>
      </div>
    </div>
  </main>

  <div id="modal-overlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="w-full max-w-2xl bg-white border border-slate-200 rounded-2xl p-6 shadow-2xl relative my-8">
      <div class="flex items-center justify-between mb-4 border-b border-slate-100 pb-3">
        <h3 id="modal-title" class="text-lg font-bold text-slate-800 flex items-center gap-2">
          <i data-lucide="file-plus" class="w-5 h-5" style="color: #23569d;"></i> <span>新增飛行紀錄</span>
        </h3>
        <button class="text-slate-400 hover:text-slate-600" onclick="toggleForm()">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="flight-form" class="space-y-3" onsubmit="handleSubmit(event)">
        <input type="hidden" id="f-doc-id" value="">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-medium text-slate-600 block mb-1" for="f-date">日期</label>
            <input id="f-date" type="date" class="w-full bg-slate-50 border border-slate-300 rounded px-3 py-1.5 text-sm text-slate-800 focus:outline-none focus:border-blue-400" required>
          </div>
          <div>
            <label class="text-xs font-medium text-slate-600 block mb-1" for="f-aircraft">機型</label>
            <select id="f-aircraft" class="w-full bg-slate-50 border border-slate-300 rounded px-3 py-1.5 text-sm text-slate-800 focus:outline-none focus:border-blue-400">
              <option value="A359">A359</option>
              <option value="A35K">A35K</option>
              <option value="B77W">B77W</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-4 gap-3">
          <div>
            <label class="text-xs font-medium text-slate-600 block mb-1" for="f-dep-iata">出發 IATA</label>
            <input id="f-dep-iata" type="text" placeholder="例: TPE" maxlength="3" class="w-full bg-slate-50 border border-slate-300 rounded px-3 py-1.5 text-sm text-slate-800 uppercase focus:outline-none" oninput="autoFillICAO('dep')">
          </div>
          <div>
            <label class="text-xs font-medium text-slate-600 block mb-1" for="f-dep-icao">出發 ICAO</label>
            <input id="f-dep-icao" type="text" placeholder="例: RCTP" maxlength="4" class="w-full bg-slate-50 border border-slate-300 rounded px-3 py-1.5 text-sm text-slate-800 uppercase focus:outline-none">
          </div>
          <div>
            <label class="text-xs font-medium text-slate-600 block mb-1" for="f-dest-iata">目的 IATA</label>
            <input id="f-dest-iata" type="text" placeholder="例: HND" maxlength="3" class="w-full bg-slate-50 border border-slate-300 rounded px-3 py-1.5 text-sm text-slate-800 uppercase focus:outline-none" oninput="autoFillICAO('dest')">
          </div>
          <div>
            <label class="text-xs font-medium text-slate-600 block mb-1" for="f-dest-icao">目的 ICAO</label>
            <input id="f-dest-icao" type="text" placeholder="例: RJTT" maxlength="4" class="w-full bg-slate-50 border border-slate-300 rounded px-3 py-1.5 text-sm text-slate-800 uppercase focus:outline-none">
          </div>
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="text-xs font-medium text-slate-600 block mb-1" for="f-pax">乘客數量 (PAX)</label>
            <input id="f-pax" type="number" min="0" class="w-full bg-slate-50 border border-slate-300 rounded px-3 py-1.5 text-sm text-slate-800 focus:outline-none">
          </div>
          <div>
            <label class="text-xs font-medium text-slate-600 block mb-1" for="f-cargo">Cargo</label>
            <input id="f-cargo" type="number" min="0" class="w-full bg-slate-50 border border-slate-300 rounded px-3 py-1.5 text-sm text-slate-800 focus:outline-none">
          </div>
          <div>
            <label class="text-xs font-medium text-slate-600 block mb-1" for="f-tow">起飛重量 (TOW)</label>
            <input id="f-tow" type="number" min="0" class="w-full bg-slate-50 border border-slate-300 rounded px-3 py-1.5 text-sm text-slate-800 focus:outline-none">
          </div>
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="text-xs font-medium text-slate-600 block mb-1" for="f-tfg">TFG</label>
            <input id="f-tfg" type="text" class="w-full bg-slate-50 border border-slate-300 rounded px-3 py-1.5 text-sm text-slate-800 focus:outline-none">
          </div>
          <div>
            <label class="text-xs font-medium text-slate-600 block mb-1" for="f-ttg">TTG</label>
            <input id="f-ttg" type="text" class="w-full bg-slate-50 border border-slate-300 rounded px-3 py-1.5 text-sm text-slate-800 focus:outline-none">
          </div>
          <div>
            <label class="text-xs font-medium text-slate-600 block mb-1" for="f-enr">ENR</label>
            <input id="f-enr" type="text" class="w-full bg-slate-50 border border-slate-300 rounded px-3 py-1.5 text-sm text-slate-800 focus:outline-none">
          </div>
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="text-xs font-medium text-slate-600 block mb-1" for="f-remaining">REMAINING</label>
            <input id="f-remaining" type="text" class="w-full bg-slate-50 border border-slate-300 rounded px-3 py-1.5 text-sm text-slate-800 focus:outline-none">
          </div>
          <div>
            <label class="text-xs font-medium text-slate-600 block mb-1" for="f-tfu">TFU</label>
            <input id="f-tfu" type="text" class="w-full bg-slate-50 border border-slate-300 rounded px-3 py-1.5 text-sm text-slate-800 focus:outline-none">
          </div>
          <div>
            <label class="text-xs font-medium text-slate-600 block mb-1" for="f-fl">飛行高度 (FL)</label>
            <input id="f-fl" type="text" class="w-full bg-slate-50 border border-slate-300 rounded px-3 py-1.5 text-sm text-slate-800 focus:outline-none">
          </div>
        </div>
        <div class="grid grid-cols-4 gap-3">
          <div>
            <label class="text-xs font-medium text-slate-600 block mb-1" for="f-lspd">降落速度</label>
            <input id="f-lspd" type="number" min="0" class="w-full bg-slate-50 border border-slate-300 rounded px-3 py-1.5 text-sm text-slate-800 focus:outline-none">
          </div>
          <div>
            <label class="text-xs font-medium text-slate-600 block mb-1" for="f-lvs">Landing V/S</label>
            <input id="f-lvs" type="number" class="w-full bg-slate-50 border border-slate-300 rounded px-3 py-1.5 text-sm text-slate-800 focus:outline-none">
          </div>
          <div>
            <label class="text-xs font-medium text-slate-600 block mb-1" for="f-hours">小時</label>
            <input id="f-hours" type="number" min="0" class="w-full bg-slate-50 border border-slate-300 rounded px-3 py-1.5 text-sm text-slate-800 focus:outline-none">
          </div>
          <div>
            <label class="text-xs font-medium text-slate-600 block mb-1" for="f-minutes">分鐘</label>
            <input id="f-minutes" type="number" min="0" max="59" class="w-full bg-slate-50 border border-slate-300 rounded px-3 py-1.5 text-sm text-slate-800 focus:outline-none">
          </div>
        </div>
        <div class="pt-3 flex gap-3">
          <button type="button" onclick="toggleForm()" class="w-1/3 py-2 rounded-lg font-medium bg-slate-100 hover:bg-slate-200 text-slate-600">取消</button>
          <button id="f-submit-btn" type="submit" class="w-2/3 py-2 rounded-lg font-medium transition-colors hover:opacity-90 text-white" style="background-color: #23569d;">儲存紀錄</button>
        </div>
      </form>
    </div>
  </div>

    async function fetchAirportCoords(code) {
      if (!code) return null;
      const iata = code.trim().toUpperCase();
      if (AIRPORT_COORDS[iata]) return AIRPORT_COORDS[iata];

      try {
        const res = await fetch(`https://port-api.com/airport/iata/${iata}`);
        if (res.ok) {
          const data = await res.json();
          if (data && data.geometry && data.geometry.coordinates) {
            const coords = [data.geometry.coordinates[1], data.geometry.coordinates[0]];
            AIRPORT_COORDS[iata] = coords;
            return coords;
          }
        }
      } catch (e) {
        console.warn(`無效機場: ${iata}`, e);
      }
      return null;
    }

    function initMap() {
      map = L.map('map', {
        center: [20, 0],
        zoom: 2,
        minZoom: 2,
        zoomControl: true,
        maxBounds: [[-90, -180], [90, 180]],
        maxBoundsViscosity: 1.0
      });

      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO',

        noWrap: true
      }).addTo(map);

      routeLayerGroup = L.layerGroup().addTo(map);
    }

    function getSplitGreatCircleArcs(start, end, nPoints = 80) {
      const toRad = deg => (deg * Math.PI) / 180;
      const toDeg = rad => (rad * 180) / Math.PI;

      const lat1 = toRad(start[0]), lon1 = toRad(start[1]);
      const lat2 = toRad(end[0]), lon2 = toRad(end[1]);

      const d = 2 * Math.asin(Math.sqrt(
        Math.pow(Math.sin((lat1 - lat2) / 2), 2) +
        Math.cos(lat1) * Math.cos(lat2) * Math.pow(Math.sin((lon1 - lon2) / 2), 2)
      ));

      if (d === 0) return [[start, end]];

      const rawPoints = [];
      for (let i = 0; i <= nPoints; i++) {
        const f = i / nPoints;
        const A = Math.sin((1 - f) * d) / Math.sin(d);
        const B = Math.sin(f * d) / Math.sin(d);

        const x = A * Math.cos(lat1) * Math.cos(lon1) + B * Math.cos(lat2) * Math.cos(lon2);
        const y = A * Math.cos(lat1) * Math.sin(lon1) + B * Math.cos(lat2) * Math.sin(lon2);
        const z = A * Math.sin(lat1) + B * Math.sin(lat2);

        const lat = Math.atan2(z, Math.sqrt(x * x + y * y));
        let lon = Math.atan2(y, x);

        rawPoints.push([toDeg(lat), toDeg(lon)]);
      }

      const arcs = [];
      let currentArc = [rawPoints[0]];

      for (let i = 1; i < rawPoints.length; i++) {
        const prev = rawPoints[i - 1];
        const curr = rawPoints[i];

        if (Math.abs(curr[1] - prev[1]) > 180) {
          arcs.push(currentArc);
          currentArc = [curr];
        } else {
          currentArc.push(curr);
        }
      }
      arcs.push(currentArc);

      return arcs;
    }

    async function updateMapRoutes(flightList) {
      if (!map || !routeLayerGroup) return;
      routeLayerGroup.clearLayers();

      const bounds = [];

      for (const f of flightList) {
        const dep = f.departure_iata;
        const dest = f.destination_iata;

        if (!dep || !dest) continue;

        try {
          const startCoords = await fetchAirportCoords(dep);
          const endCoords = await fetchAirportCoords(dest);

          if (startCoords && endCoords) {
            bounds.push(startCoords, endCoords);

            const splitArcs = getSplitGreatCircleArcs(startCoords, endCoords, 80);

            splitArcs.forEach(arc => {
              L.polyline(arc, {
                color: '#23569d',
                weight: 2.5,
                opacity: 0.8,
                dashArray: '6, 6'
              }).addTo(routeLayerGroup);
            });

            [{ coord: startCoords, code: dep, type: 'dep' }, { coord: endCoords, code: dest, type: 'dest' }].forEach(item => {
              L.circleMarker(item.coord, {
                radius: 4,
                fillColor: item.type === 'dep' ? '#10b981' : '#ef4444',
                color: '#ffffff',
                weight: 1.5,
                fillOpacity: 0.9
              }).bindTooltip(item.code, { permanent: false, direction: 'top' })
                .addTo(routeLayerGroup);
            });
          }
        } catch (err) {
          console.error(`繪製 ${dep} -> ${dest} 失敗:`, err);
        }
      }

      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [30, 30] });
      }
    }

    function formatHoursToHM(decimalHours) {
      const totalMinutes = Math.round((Number(decimalHours) || 0) * 60);
      const hrs = Math.floor(totalMinutes / 60);
      const mins = totalMinutes % 60;
      return `${hrs}:${mins.toString().padStart(2, '0')}`;
    }

    function initFirestoreListener() {
      db.collection("flights")
        .onSnapshot(async (snapshot) => {
          flights = snapshot.docs.map(doc => ({
            id: doc.id,
            ...doc.data()
          }));

          flights.sort((a, b) => {
            const dateA = new Date(a.flight_date || 0);
            const dateB = new Date(b.flight_date || 0);
            if (dateB - dateA !== 0) return dateB - dateA;
            const timeA = a.createdAt?.toDate ? a.createdAt.toDate().getTime() : 0;
            const timeB = b.createdAt?.toDate ? b.createdAt.toDate().getTime() : 0;
            return timeB - timeA;
          });

          await renderFlights();
        }, (error) => {
          console.error("Firestore 監聽失敗:", error);
        });
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const btn = e.target.querySelector('[type="submit"]');
      btn.disabled = true;

      const docId = document.getElementById('f-doc-id').value;
      const record = {
        flight_date: document.getElementById('f-date').value || new Date().toISOString().split('T')[0],
        departure_iata: (document.getElementById('f-dep-iata').value || '').toUpperCase().trim(),
        departure_icao: (document.getElementById('f-dep-icao').value || '').toUpperCase().trim(),
        destination_iata: (document.getElementById('f-dest-iata').value || '').toUpperCase().trim(),
        destination_icao: (document.getElementById('f-dest-icao').value || '').toUpperCase().trim(),
        aircraft_type: document.getElementById('f-aircraft').value,
        passengers: parseInt(document.getElementById('f-pax').value) || 0,
        cargo: parseInt(document.getElementById('f-cargo').value) || 0,
        takeoff_weight: parseInt(document.getElementById('f-tow').value) || 0,
        tfg: document.getElementById('f-tfg').value,
        ttg: document.getElementById('f-ttg').value,
        enr: document.getElementById('f-enr').value,
        remaining: document.getElementById('f-remaining').value,
        tfu: document.getElementById('f-tfu').value,
        flight_level: document.getElementById('f-fl').value,
        landing_speed: parseInt(document.getElementById('f-lspd').value) || 0,
        landing_vs: parseInt(document.getElementById('f-lvs').value) || 0,
        flight_hours: (parseInt(document.getElementById('f-hours').value) || 0) + ((parseInt(document.getElementById('f-minutes').value) || 0) / 60)
      };

      try {
        if (docId) await db.collection("flights").doc(docId).update(record);
        else {
          record.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          await db.collection("flights").add(record);
        }
        e.target.reset();
        toggleForm();
      } catch (err) {
        alert('儲存失敗：' + err.message);
      } finally {
        btn.disabled = false;
      }
    }

    function formatAirport(iata, icao) {
      const displayIata = iata || '—';
      const tooltipIcao = icao ? `ICAO: ${icao}` : '';
      return tooltipIcao 
        ? `<span title="${tooltipIcao}" class="cursor-help border-b border-dotted border-blue-400 hover:text-blue-600 transition-colors">${displayIata}</span>`
        : displayIata;
    }

    async function renderFlights() {
      const tbody = document.getElementById('flight-table-body');
      const empty = document.getElementById('empty-state');
      const emptyMsg = document.getElementById('empty-msg');
      tbody.innerHTML = '';

      // 綜合多重條件過濾：日期、出發地、目的地（支援 IATA 或 ICAO 模糊比對）
      const filteredFlights = flights.filter(f => {
        let matchDate = true;
        let matchDep = true;
        let matchDest = true;

        if (selectedFilterDate) {
          matchDate = (f.flight_date === selectedFilterDate);
        }

        if (selectedFilterDep) {
          const iata = (f.departure_iata || '').toUpperCase();
          const icao = (f.departure_icao || '').toUpperCase();
          matchDep = iata.includes(selectedFilterDep) || icao.includes(selectedFilterDep);
        }

        if (selectedFilterDest) {
          const iata = (f.destination_iata || '').toUpperCase();
          const icao = (f.destination_icao || '').toUpperCase();
          matchDest = iata.includes(selectedFilterDest) || icao.includes(selectedFilterDest);
        }

        return matchDate && matchDep && matchDest;
      });

      filteredFlights.forEach(f => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-blue-50/50 transition-colors whitespace-nowrap text-center align-middle';
        
        tr.innerHTML = `
          <td class="p-3 text-slate-800 font-medium text-center align-middle">${f.flight_date || '—'}</td>
          <td class="p-3 text-center align-middle"><span class="bg-blue-50 text-blue-600 border border-blue-200 px-2 py-0.5 rounded text-xs font-semibold">${f.aircraft_type || '—'}</span></td>
          <td class="p-3 font-semibold text-slate-800 text-center align-middle">${formatAirport(f.departure_iata, f.departure_icao)}</td>
          <td class="p-3 text-slate-400 text-center px-1 align-middle"><i data-lucide="arrow-right" class="w-3.5 h-3.5 inline-block align-middle"></i></td>
          <td class="p-3 font-semibold text-slate-800 text-center align-middle">${formatAirport(f.destination_iata, f.destination_icao)}</td>
          <td class="p-3 font-bold text-center align-middle" style="color: #23569d;">${formatHoursToHM(f.flight_hours)}</td>
          <td class="p-3 text-center align-middle">${f.flight_level ? 'FL' + f.flight_level : '—'}</td>
          <td class="p-3 text-center align-middle">${f.passengers || 0}</td>
          <td class="p-3 text-center align-middle">${f.cargo || 0}</td>
          <td class="p-3 text-center align-middle">${f.takeoff_weight || 0}</td>
          <td class="p-3 text-slate-600 text-center align-middle">${f.tfg || '—'}</td>
          <td class="p-3 text-slate-600 text-center align-middle">${f.ttg || '—'}</td>
          <td class="p-3 text-slate-600 text-center align-middle">${f.enr || '—'}</td>
          <td class="p-3 text-slate-600 text-center align-middle">${f.remaining || '—'}</td>
          <td class="p-3 text-slate-600 text-center align-middle">${f.tfu || '—'}</td>
          <td class="p-3 text-slate-600 text-center align-middle">${f.landing_speed ? f.landing_speed + ' kt' : '—'}</td>
          <td class="p-3 text-slate-600 text-center align-middle">${f.landing_vs ? f.landing_vs + ' fpm' : '—'}</td>
          <td class="p-3 text-center align-middle">
            <div class="inline-flex items-center gap-1">
              <button class="text-slate-400 hover:text-blue-600 p-1 rounded hover:bg-slate-100 transition-all" title="編輯" onclick="editFlight('${f.id}')"><i data-lucide="pencil" class="w-4 h-4"></i></button>
              <button class="text-slate-400 hover:text-red-500 p-1 rounded hover:bg-slate-100 transition-all" title="刪除" onclick="deleteFlight('${f.id}')"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });

      const totalA359 = flights.filter(f => f.aircraft_type === 'A359').reduce((s, f) => s + (Number(f.flight_hours) || 0), 0);
      const totalA35K = flights.filter(f => f.aircraft_type === 'A35K').reduce((s, f) => s + (Number(f.flight_hours) || 0), 0);

      document.getElementById('hours-a359').textContent = formatHoursToHM(totalA359);
      document.getElementById('hours-a35k').textContent = formatHoursToHM(totalA35K);

      if (filteredFlights.length) {
        empty.style.display = 'none';
      } else {
        empty.style.display = 'flex';
        const activeFilters = [];
        if (selectedFilterDate) activeFilters.push(`日期: ${selectedFilterDate}`);
        if (selectedFilterDep) activeFilters.push(`出發地: ${selectedFilterDep}`);
        if (selectedFilterDest) activeFilters.push(`目的地: ${selectedFilterDest}`);
        
        emptyMsg.textContent = activeFilters.length 
          ? `找不到符合條件 (${activeFilters.join(', ')}) 的飛行紀錄` 
          : '尚無飛行紀錄，點擊按鈕新增紀錄';
      }
      
      lucide.createIcons();
      await updateMapRoutes(filteredFlights);
    }

    async function deleteFlight(docId) {
      if (!docId) return;
      if (confirm('確定要刪除這筆飛行紀錄嗎？')) {
        try { await db.collection("flights").doc(docId).delete(); }
        catch (err) { alert('刪除失敗：' + err.message); }
      }
    }

    // ===== CSV 匯出 / 匯入 功能 =====
    function exportToCSV() {
      if (!flights || flights.length === 0) {
        alert('目前無資料可供匯出');
        return;
      }

      const headers = [
        'flight_date', 'aircraft_type', 'departure_iata', 'departure_icao', 
        'destination_iata', 'destination_icao', 'flight_hours', 'flight_level', 
        'passengers', 'cargo', 'takeoff_weight', 'tfg', 'ttg', 'enr', 
        'remaining', 'tfu', 'landing_speed', 'landing_vs'
      ];

      const csvRows = [headers.join(',')];

      flights.forEach(f => {
        const row = headers.map(header => {
          let val = f[header] ?? '';
          if (typeof val === 'string' && (val.includes(',') || val.includes('"') || val.includes('\n'))) {
            val = `"${val.replace(/"/g, '""')}"`;
          }
          return val;
        });
        csvRows.push(row.join(','));
      });

      const csvContent = '\uFEFF' + csvRows.join('\n'); // 加上 UTF-8 BOM 避免 Excel 打開亂碼
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', `flight_log_${new Date().toISOString().split('T')[0]}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function importFromCSV(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (evt) => {
        try {
          const text = evt.target.result;
          const lines = text.split(/\r\n|\n/).filter(line => line.trim() !== '');
          if (lines.length < 2) {
            alert('CSV 檔案格式錯誤或內容為空');
            return;
          }

          const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
          const batch = db.batch();

          for (let i = 1; i < lines.length; i++) {
            const values = lines[i].split(',').map(v => v.trim().replace(/^"|"$/g, ''));
            const record = {};

            headers.forEach((h, idx) => {
              let val = values[idx] || '';
              if (['passengers', 'cargo', 'takeoff_weight', 'landing_speed', 'landing_vs'].includes(h)) {
                val = parseInt(val) || 0;
              } else if (h === 'flight_hours') {
                val = parseFloat(val) || 0;
              }
              record[h] = val;
            });

            record.createdAt = firebase.firestore.FieldValue.serverTimestamp();
            const docRef = db.collection("flights").doc();
            batch.set(docRef, record);
          }

          await batch.commit();
          alert(`成功匯入 ${lines.length - 1} 筆紀錄！`);
        } catch (err) {
          alert('匯入失敗：' + err.message);
        } finally {
          e.target.value = '';
        }
      };

      reader.readAsText(file);
    }

    window.onload = () => {
      initMap();
      initFirestoreListener();
      lucide.createIcons();
    };
  </script>
</body>
